##################################################
# WAIT FOR APT TO BE READY
##################################################

- name: Wait for apt lock to be released
  shell: |
    while fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1; do
      echo "Waiting for apt lock..."
      sleep 5
    done
  changed_when: false
  no_log: true

- name: Wait for unattended upgrades to finish
  shell: |
    while fuser /var/lib/apt/lists/lock >/dev/null 2>&1; do
      echo "Waiting for apt lists lock..."
      sleep 5
    done
  changed_when: false
  no_log: true

- name: Fix interrupted dpkg
  command: dpkg --configure -a
  ignore_errors: true
  no_log: false

- name: Clean apt cache
  command: apt-get clean
  ignore_errors: true
  no_log: false

- name: Update apt cache
  apt:
    update_cache: true
    lock_timeout: 120
  no_log: true

##################################################
# Install Docker properly
##################################################

- name: Remove conflicting Docker packages
  apt:
    name:
      - containerd
      - containerd.io
      - docker
      - docker-engine
      - docker.io
      - runc
    state: absent
    purge: true
  ignore_errors: true
  no_log: true

- name: Install Docker dependencies
  apt:
    name:
      - docker.io
      - docker-compose
      - containerd
      - curl
      - gnupg
      - python3-pip
    state: present
    lock_timeout: 120
  no_log: true

- name: Install Docker Python SDK
  pip:
    name: docker
  no_log: true

- name: Create docker cli-plugins directory
  file:
    path: /usr/libexec/docker/cli-plugins
    state: directory
    mode: '0755'
  no_log: true

- name: Install Docker Compose plugin
  get_url:
    url: https://github.com/docker/compose/releases/latest/download/docker-compose-linux-x86_64
    dest: /usr/libexec/docker/cli-plugins/docker-compose
    mode: '0755'
  no_log: true

- name: Install Docker Buildx plugin
  get_url:
    url: https://github.com/docker/buildx/releases/download/v0.31.1/buildx-v0.31.1.linux-amd64
    dest: /usr/libexec/docker/cli-plugins/docker-buildx
    mode: '0755'
  no_log: true

##################################################
# Configure containerd properly
##################################################

- name: Create containerd config directory
  file:
    path: /etc/containerd
    state: directory
  no_log: true

- name: Generate containerd config
  command: containerd config default
  register: containerd_config
  changed_when: false
  no_log: true

- name: Write containerd config
  copy:
    content: "{{ containerd_config.stdout }}"
    dest: /etc/containerd/config.toml
  no_log: true


##################################################
# Start container services
##################################################

- name: Start and enable containerd
  systemd:
    name: containerd
    state: started
    enabled: true
    daemon_reload: true
  no_log: true

- name: Start and enable docker
  systemd:
    name: docker
    state: started
    enabled: true
    daemon_reload: true
  no_log: true

##################################################
# Docker Swarm setup
##################################################

- name: Init swarm on leader_swarm
  command: docker swarm init --advertise-addr {{ ansible_eth1.ipv4.address }}
  when: inventory_hostname in groups['swarm_leaders']
  ignore_errors: true

- name: Get manager join token
  command: docker swarm join-token -q manager
  register: manager_token
  when: inventory_hostname in groups['swarm_leaders']
  changed_when: false

- name: Join swarm as manager
  command: >
    docker swarm join
    --token {{ hostvars[groups['swarm_leaders'][0]]['manager_token']['stdout'] }}
    {{ hostvars[groups['swarm_leaders'][0]]['ansible_eth1']['ipv4']['address'] }}:2377
  when:
    - inventory_hostname not in groups['swarm_leaders']
    - hostvars[groups['swarm_leaders'][0]]['manager_token'] is defined
    - hostvars[groups['swarm_leaders'][0]]['manager_token']['stdout'] is defined
  ignore_errors: true

- name: Set monitoring label on leader_swarm
  command: docker node update --label-add role=monitoring {{ ansible_hostname }}
  when: inventory_hostname in groups['swarm_leaders']
  ignore_errors: true

- name: Set ingress label on other nodes
  command: docker node update --label-add role=ingress {{ inventory_hostname }}
  when: inventory_hostname not in groups['swarm_leaders']
  ignore_errors: true


##################################################
# App stack deploy (runs on leader_swarm after swarm is ready)
##################################################

- name: Create application directory
  file:
    path: /opt/minitwit
    state: directory
    mode: '0755'
  when: inventory_hostname in groups['swarm_managers']
  no_log: true

- name: Create config directories
  file:
    path: "/opt/minitwit/{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - prometheus
    - loki
    - promtail
    - grafana
  when: inventory_hostname in groups['swarm_leaders']

##################################################
# DB server tasks (runs on leader_swarm)
##################################################


- name: Deploy Docker Compose on DB Server
  hosts: swarm_leaders
  become: true
  tasks:
    - name: Create db directory
      file:
        path: /root/db
        state: directory
        mode: '0755'
      when: inventory_hostname in groups['swarm_leaders']

    - name: Copy docker-compose-db.yaml to DB server
      copy:
        src: ../docker-compose-db.yaml
        dest: /root/docker-compose-db.yaml
        owner: root
        group: root
        mode: '0644'
      when: inventory_hostname in groups['swarm_leaders']

    - name: Start Docker Compose containers
      command: docker compose -f /root/docker-compose-db.yaml up -d
      register: compose_result
      changed_when: "'Started' in compose_result.stdout or 'created' in compose_result.stdout"
      when: inventory_hostname in groups['swarm_leaders']

    - name: Display Docker Compose result
      debug:
        msg: "{{ compose_result.stdout }}"
      when: inventory_hostname in groups['swarm_leaders']

  # Deploy stack to swarm

- name: Deploy stack to swarm
  command:   docker stack deploy -c docker-stack.yml minitwit --with-registry-auth --resolve-image always
  environment:
    DOCKER_IMAGE: "{{ DOCKER_IMAGE | default('runtimeerroritu/minitwit:latest') }}"
    PROM_IMAGE: "{{ PROM_IMAGE | default('runtimeerroritu/minitwit-prometheus:latest') }}"
    DB_ADDR: "{{ DB_ADDR }}"
    DOMAIN: "{{ DOMAIN }}"
    MANAGER1_IP: "{{ MANAGER1_IP }}"
    MANAGER2_IP: "{{ MANAGER2_IP }}"
    PROM_URL: "{{ PROM_URL }}"
    GRAFANA_URL: "{{ GRAFANA_URL }}"
    ENTRYPOINT: "{{ ENTRYPOINT }}"
    TLS_ENABLED: "{{ TLS_ENABLED }}"
    CONFIG_VER: "{{ CONFIG_VER }}"
  when: inventory_hostname in groups['swarm_leaders']
