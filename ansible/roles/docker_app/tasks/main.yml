##################################################
# WAIT FOR APT TO BE READY
##################################################

- name: Wait for apt lock to be released
  shell: |
    while fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1; do
      echo "Waiting for apt lock..."
      sleep 5
    done
  changed_when: false
  no_log: true

- name: Wait for unattended upgrades to finish
  shell: |
    while fuser /var/lib/apt/lists/lock >/dev/null 2>&1; do
      echo "Waiting for apt lists lock..."
      sleep 5
    done
  changed_when: false
  no_log: true

- name: Fix interrupted dpkg
  command: dpkg --configure -a
  ignore_errors: true
  no_log: true

- name: Clean apt cache
  command: apt-get clean
  no_log: true

- name: Update apt cache
  apt:
    update_cache: true
    lock_timeout: 120
  no_log: true

##################################################
# Install Docker properly
##################################################

- name: Remove conflicting Docker packages
  apt:
    name:
      - containerd
      - containerd.io
      - docker
      - docker-engine
      - docker.io
      - runc
    state: absent
    purge: true
  ignore_errors: true
  no_log: true

- name: Install Docker dependencies
  apt:
    name:
      - docker.io
      - docker-compose
      - containerd
      - python3-pip
    state: present
    lock_timeout: 120
  no_log: true

- name: Install Docker Python SDK
  pip:
    name: docker
  no_log: true

- name: Create docker cli-plugins directory
  file:
    path: /usr/libexec/docker/cli-plugins
    state: directory
    mode: '0755'
  no_log: true

- name: Install Docker Compose plugin
  get_url:
    url: https://github.com/docker/compose/releases/latest/download/docker-compose-linux-x86_64
    dest: /usr/libexec/docker/cli-plugins/docker-compose
    mode: '0755'
  no_log: true

- name: Install Docker Buildx plugin
  get_url:
    url: https://github.com/docker/buildx/releases/download/v0.31.1/buildx-v0.31.1.linux-amd64
    dest: /usr/libexec/docker/cli-plugins/docker-buildx
    mode: '0755'
  no_log: true

##################################################
# Configure containerd properly
##################################################

- name: Create containerd config directory
  file:
    path: /etc/containerd
    state: directory
  no_log: true

- name: Generate containerd config
  command: containerd config default
  register: containerd_config
  changed_when: false
  no_log: true

- name: Write containerd config
  copy:
    content: "{{ containerd_config.stdout }}"
    dest: /etc/containerd/config.toml
  no_log: true

##################################################
# Create image in dockerhub
##################################################

- name: Log in to Docker Hub
  community.docker.docker_login:
    username: "{{ DOCKERHUB_USERNAME_Test }}"
    password: "{{ DOCKERHUB_TOKEN_Test }}"
  delegate_to: localhost
  become: false
  run_once: true

- name: Build DB image
  community.docker.docker_image:
    name: "{{ DOCKERHUB_USERNAME_Test }}/minitwit-db:latest"
    build:
      path: "{{ playbook_dir }}/../"
      dockerfile: docker/Dockerfile-db
    source: build
    push: true
  delegate_to: localhost
  become: false
  when: inventory_hostname == "leader_swarm"
  no_log: true

- name: Build APP image
  community.docker.docker_image:
    name: "{{ DOCKERHUB_USERNAME_Test }}/minitwit:latest"
    build:
      path: "{{ playbook_dir }}/../"
      dockerfile: docker/Dockerfile-app
      args:
        GO_VERSION: "1.25.0"
    source: build
    push: true
  delegate_to: localhost
  become: false
  when: inventory_hostname == "manager1"
  no_log: true

##################################################
# Start container services
##################################################

- name: Start and enable containerd
  systemd:
    name: containerd
    state: started
    enabled: true
    daemon_reload: true
  no_log: true

- name: Start and enable docker
  systemd:
    name: docker
    state: started
    enabled: true
    daemon_reload: true
  no_log: true

##################################################
# Docker Swarm setup
##################################################

- name: Init swarm on leader_swarm
  command: docker swarm init --advertise-addr {{ ansible_eth1.ipv4.address }}
  when: inventory_hostname == "leader_swarm"
  ignore_errors: true

- name: Get manager join token
  command: docker swarm join-token -q manager
  register: manager_token
  when: inventory_hostname == "leader_swarm"
  changed_when: false

- name: Join swarm as manager
  command: >
    docker swarm join
    --token {{ hostvars['leader_swarm']['manager_token']['stdout'] }}
    {{ hostvars['leader_swarm']['ansible_eth1']['ipv4']['address'] }}:2377
  when:
    - inventory_hostname != "leader_swarm"
    - hostvars['leader_swarm']['manager_token'] is defined
    - hostvars['leader_swarm']['manager_token']['stdout'] is defined
  ignore_errors: true

##################################################
# DB server tasks (runs on leader_swarm)
##################################################

- name: Create DB directory
  file:
    path: /opt/minitwit-db
    state: directory
  when: inventory_hostname == "leader_swarm"
  no_log: true

- name: Create docker directory
  file:
    path: /opt/minitwit-db/docker
    state: directory
  when: inventory_hostname == "leader_swarm"
  no_log: true

- name: Create db directory
  file:
    path: /opt/minitwit-db/db
    state: directory
  when: inventory_hostname == "leader_swarm"
  no_log: true

- name: Copy docker compose file to DB server
  copy:
    src: "{{ playbook_dir }}/../docker-compose-db.yaml"
    dest: /opt/minitwit-db/
    owner: root
    group: root
    mode: '0755'
  when: inventory_hostname == "leader_swarm"
  notify: restart db
  no_log: true

- name: Copy docker files to DB server
  copy:
    src: "{{ playbook_dir }}/../docker/Dockerfile-db"
    dest: /opt/minitwit-db/docker/Dockerfile-db
    owner: root
    group: root
    mode: '0755'
  when: inventory_hostname == "leader_swarm"
  no_log: false

- name: Copy Schema SQL to DB server
  copy:
    src: "{{ playbook_dir }}/../db/schema.sql"
    dest: /opt/minitwit-db/db/schema.sql
    owner: root
    group: root
    mode: '0755'
  when: inventory_hostname == "leader_swarm"
  no_log: true

- name: Start DB container
  community.docker.docker_compose_v2:
    project_src: /opt/minitwit-db
    files:
      - docker-compose-db.yaml
    state: present
    build: always
  when: inventory_hostname == "leader_swarm"
  no_log: true

##################################################
# App stack deploy (runs on leader_swarm after swarm is ready)
##################################################

- name: Create application directory
  file:
    path: /opt/minitwit
    state: directory
    mode: '0755'
  when: inventory_hostname == "leader_swarm"
  no_log: true

- name: Copy docker compose file to leader
  copy:
    src: "{{ playbook_dir }}/../docker-compose-app.yaml"
    dest: /opt/minitwit/docker-compose-app.yaml
    mode: '0755'
  when: inventory_hostname == "leader_swarm"
  no_log: true

- name: Deploy stack to swarm
  command: docker stack deploy -c /opt/minitwit/docker-compose-app.yaml minitwit
  when: inventory_hostname == "leader_swarm"
