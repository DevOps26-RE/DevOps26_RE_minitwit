- name: Build APP image
  community.docker.docker_image:
    name: "{{ DOCKERHUB_USERNAME_Test }}/minitwit:latest"
    build:
      path: "{{ playbook_dir }}/../"
      dockerfile: docker/Dockerfile-app
      args:
        GO_VERSION: "1.25.0"
    source: build
    push: true
  delegate_to: localhost
  become: false
  when: inventory_hostname == "manager1"
  no_log: true

##################################################
# Start container services
##################################################

- name: Start and enable containerd
  systemd:
    name: containerd
    state: started
    enabled: true
    daemon_reload: true
  no_log: true

- name: Start and enable docker
  systemd:
    name: docker
    state: started
    enabled: true
    daemon_reload: true
  no_log: true

##################################################
# Docker Swarm setup
##################################################

- name: Init swarm on leader_swarm
  command: docker swarm init --advertise-addr {{ ansible_eth1.ipv4.address }}
  when: inventory_hostname in groups['swarm_leaders']
  ignore_errors: true

- name: Get manager join token
  command: docker swarm join-token -q manager
  register: manager_token
  when: inventory_hostname in groups['swarm_leaders']
  changed_when: false

- name: Join swarm as manager
  command: >
    docker swarm join
    --token {{ hostvars[groups['swarm_leaders'][0]]['manager_token']['stdout'] }}
    {{ hostvars[groups['swarm_leaders'][0]]['ansible_eth1']['ipv4']['address'] }}:2377
  when:
    - inventory_hostname not in groups['swarm_leaders']
    - hostvars[groups['swarm_leaders'][0]]['manager_token'] is defined
    - hostvars[groups['swarm_leaders'][0]]['manager_token']['stdout'] is defined
  ignore_errors: true

- name: Set monitoring label on leader_swarm
  command: docker node update --label-add role=monitoring {{ ansible_hostname }}
  when: inventory_hostname in groups['swarm_leaders']
  ignore_errors: true

- name: Set ingress label on other nodes
  command: docker node update --label-add role=ingress {{ inventory_hostname }}
  when: inventory_hostname not in groups['swarm_leaders']
  ignore_errors: true

##################################################
# DB server tasks (runs on leader_swarm)
##################################################

- name: Create DB directory
  file:
    path: /opt/minitwit-db
    state: directory
  when: inventory_hostname in groups['swarm_leaders']
  no_log: true

# - name: Create docker directory
#   file:
#     path: /opt/minitwit-db/docker
#     state: directory
#   when: inventory_hostname in groups['swarm_leaders']
#   no_log: true

- name: Create db directory
  file:
    path: /opt/minitwit-db/db
    state: directory
  when: inventory_hostname in groups['swarm_leaders']
  no_log: true

- name: Copy docker compose file to DB server
  copy:
    src: "{{ playbook_dir }}/../docker-compose-db.yaml"
    dest: /opt/minitwit-db/
    owner: root
    group: root
    mode: '0755'
  when: inventory_hostname in groups['swarm_leaders']
  notify: restart db
  no_log: true

# - name: Copy docker files to DB server
#   copy:
#     src: "{{ playbook_dir }}/../docker/Dockerfile-db"
#     dest: /opt/minitwit-db/docker/Dockerfile-db
#     owner: root
#     group: root
#     mode: '0755'
#   when: inventory_hostname in groups['swarm_leaders']
#   no_log: false

- name: Copy Schema SQL to DB server
  copy:
    src: "{{ playbook_dir }}/../db/schema.sql"
    dest: /opt/minitwit-db/db/schema.sql
    owner: root
    group: root
    mode: '0755'
  when: inventory_hostname in groups['swarm_leaders']
  no_log: true

- name: Start DB container
  community.docker.docker_compose_v2:
    project_src: /opt/minitwit-db
    files:
      - docker-compose-db.yaml
    state: present
    build: always
  when: inventory_hostname in groups['swarm_leaders']
  no_log: true

##################################################
# App stack deploy (runs on leader_swarm after swarm is ready)
##################################################

- name: Create application directory
  file:
    path: /opt/minitwit
    state: directory
    mode: '0755'
  when: inventory_hostname in groups['swarm_leaders']
  no_log: true

- name: Copy docker stack file to leader
  copy:
    src: "{{ playbook_dir }}/../docker-stack.yml"
    dest: /opt/minitwit/docker-stack.yml
    mode: '0755'
  when: inventory_hostname in groups['swarm_leaders']
  no_log: true

- name: Create minitwit_deploy config directory
  file:
    path: /opt/minitwit/minitwit_deploy
    state: directory
    mode: '0755'
  when: inventory_hostname in groups['swarm_leaders']

- name: Copy stack config files
  copy:
    src: "{{ item.src }}"
    dest: "/opt/minitwit/minitwit_deploy/{{ item.dest }}"
    mode: '0644'
  loop:
    - { src: "{{ playbook_dir }}/../prometheus/prometheus.yml", dest: "prometheus.yml" }
    - { src: "{{ playbook_dir }}/../loki/loki-config.yaml", dest: "loki-config.yaml" }
    - { src: "{{ playbook_dir }}/../promtail/promtail-config.yaml", dest: "promtail-config.yaml" }
    - { src: "{{ playbook_dir }}/../grafana/datasources.yaml", dest: "datasources.yaml" }
  when: inventory_hostname in groups['swarm_leaders']

- name: Deploy stack to swarm
  command: docker stack deploy -c /opt/minitwit/docker-stack.yml minitwit --with-registry-auth
  environment:
    DOCKER_IMAGE: "{{ DOCKER_IMAGE | default('runtimeerroritu/minitwit:latest') }}"
    PROM_IMAGE: "{{ PROM_IMAGE | default('runtimeerroritu/minitwit-prometheus:latest') }}"
    DB_ADDR: "{{ DB_ADDR }}"
    DOMAIN: "{{ DOMAIN }}"
    MANAGER1_IP: "{{ MANAGER1_IP }}"
    MANAGER2_IP: "{{ MANAGER2_IP }}"
    PROM_URL: "{{ PROM_URL }}"
    GRAFANA_URL: "{{ GRAFANA_URL }}"
  when: inventory_hostname in groups['swarm_leaders']
