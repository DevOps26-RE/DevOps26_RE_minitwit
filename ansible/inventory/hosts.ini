# =============================================================================
# Ansible Static Inventory for MiniTwit Docker Swarm Cluster
# =============================================================================
#
# IMPORTANT: Fill in the actual DigitalOcean public and private IPs after
# running `vagrant up`. Private IPs (10.x.x.x) are found in the DigitalOcean
# control panel under Droplets > Networking, or via `ip addr show eth1` on
# each droplet.
#
# Node roles:
#   swarmnode  - Node 3: initial Swarm manager + Traefik ingress
#   dbserver   - Node 2: PostgreSQL database + Swarm manager (HA)
#   webserver  - Node 1: monitoring stack + joins Swarm last (Phase 3)
#
# Why a static inventory instead of Vagrant's auto-generated one?
#   Vagrant generates an inventory that maps VM names to IPs dynamically.
#   This works for simple `hosts: all` playbooks, but breaks the moment
#   you need host-group targeting (e.g. `hosts: swarm_managers`) or
#   host_vars (e.g. private_ip per node). A static inventory also survives
#   `vagrant destroy` / `vagrant up` cycles without losing group structure.
# =============================================================================

[swarm_managers]
# swarmnode is the FIRST manager — swarm is initialized here.
# After Phase 3, dbserver also becomes a manager (joined in swarm_init role).
swarmnode ansible_host=<NODE3_PUBLIC_IP> ansible_user=root ansible_ssh_private_key_file=~/.ssh/id_rsa

[db_server]
dbserver  ansible_host=<NODE2_PUBLIC_IP> ansible_user=root ansible_ssh_private_key_file=~/.ssh/id_rsa

[app_nodes]
# Nodes that run app workloads (web replicas, Traefik).
# dbserver is excluded to keep database I/O isolated from app containers.
swarmnode ansible_host=<NODE3_PUBLIC_IP> ansible_user=root ansible_ssh_private_key_file=~/.ssh/id_rsa
webserver ansible_host=<NODE1_PUBLIC_IP> ansible_user=root ansible_ssh_private_key_file=~/.ssh/id_rsa

[all:vars]
ansible_python_interpreter=/usr/bin/python3
