services:
  traefik:
    image: traefik:v3.6
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      # Traefik will open an entry called "web", listen to 5001 Port in the docker container
      - "--entrypoints.web.address=:5001"
      - "--entrypoints.prom.address=:9090"
      - "--entrypoints.grafana.address=:3000"
    ports:
      # Traefik will occupied the 5001 port on the server
      - "5001:5001"
      - "3000:3000"
      - "9090:9090"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"

  web:
    image: ${DOCKER_IMAGE:-runtimeerroritu/minitwit:latest}
    environment:
      DB_ADDR: ${DB_ADDR}
      # Note: can't add port here, so it will use Traefik
    labels:
      - "traefik.enable=true"
      # find the entry "web"
      - "traefik.http.routers.myweb.entrypoints=web"
      # accept all path from the router
      - "traefik.http.routers.myweb.rule=PathPrefix(`/`)"
      # tell Traefik which port will Go app use inside the container
      - "traefik.http.services.myweb.loadbalancer.server.port=5001"
    deploy:
      update_config:
        # Zero down time key point: start a new container -> redirect the traffic -> close the old container
        order: start-first
        failure_action: rollback
        delay: 5s

  prometheus:
    image: ${PROM_IMAGE:-runtimeerroritu/minitwit-prometheus:latest}
    volumes:
      # Keep ONLY the named volume for data persistence; remove the bind mount
      - prometheus_data:/prometheus
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.myprom.entrypoints=prom"
      - "traefik.http.routers.myprom.rule=PathPrefix(`/`)"
      - "traefik.http.services.myprom.loadbalancer.server.port=9090"
      - "traefik.http.routers.myprom.middlewares=prom-auth"
      - "traefik.http.middlewares.prom-auth.basicauth.users=admin:$$apr1$$DeLv2Ozt$$Eo3rIkwIIqAmpdBKeCNHw1"
    depends_on:
      - web

  grafana:
    image: grafana/grafana:latest
    volumes:
      # Persist Grafana dashboards and configurations
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    labels:
      - "traefik.enable=true"
      # Connect Grafana to its specific Traefik entrypoint
      - "traefik.http.routers.mygrafana.entrypoints=grafana"
      # Accept all paths for the Grafana UI
      - "traefik.http.routers.mygrafana.rule=PathPrefix(`/`)"
      # Tell Traefik to forward traffic to Grafana's internal port 3000
      - "traefik.http.services.mygrafana.loadbalancer.server.port=3000"

volumes:
  prometheus_data:
  grafana_data: