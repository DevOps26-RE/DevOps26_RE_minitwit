---
services:
  traefik:
    image: traefik:v3.6
    command:
      - "--providers.docker=true"
      - "--providers.docker.swarmMode=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:5001"
      - "--accesslog=true"
    ports:
      - "5001:5001"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    deploy:
      replicas: 1
      placement:
        - node.role == manager # must run on menager to access socket

  web:
    image: ${DOCKER_IMAGE:-runtimeerroritu/minitwit:latest}
    environment:
      DB_ADDR: ${DB_ADDR}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.myweb.entrypoints=web"
      - "traefik.http.routers.myweb.rule=PathPrefix(`/`)"
      - "traefik.http.services.myweb.loadbalancer.server.port=5001"
    deploy:
      replicas: 3
      placement:
        constriants:
          - node.hostname != leader # run only on manager1 and manager2 
          # - node.role == worker # can be restricted by the role or hostname 
      update_config:
        order: start-first
        failure_action: rollback
        delay: 5s

  prometheus:
    image: ${PROM_IMAGE:-runtimeerroritu/minitwit-prometheus:latest}
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.external-url=${PROM_URL:-http://localhost:5001/prometheus}"
      - "--web.route-prefix=/prometheus"
    volumes:
      - prometheus_data:/prometheus
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.myprom.entrypoints=web"
      - "traefik.http.routers.myprom.rule=PathPrefix(`/prometheus`)"
      - "traefik.http.services.myprom.loadbalancer.server.port=9090"
      - "traefik.http.routers.myprom.middlewares=prom-auth"
      - "traefik.http.middlewares.prom-auth.basicauth.users=admin:$$apr1$$DeLv2Ozt$$Eo3rIkwIIqAmpdBKeCNHw1"
    deploy:
      replicas: 1
      placement:
        constriants:
          - node.role == manager
  # Loki stores and indexes logs received from Promtail.
  # It is intentionally not exposed externally — Promtail pushes to it
  # and Grafana queries it via the internal Docker network only.
  loki:
    image: grafana/loki:3.7.0
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    deploy:
      replicas: 1
      placement:
        constriants:
          - node.role == manager   
  # Promtail ships logs from all containers to Loki.
  # It reads the Docker socket to auto-discover running containers —
  # no container names are hardcoded, so new services are picked up
  # automatically without any config changes.
  promtail:
    image: grafana/promtail:3.6.0
    command: -config.file=/etc/promtail/promtail-config.yaml
    volumes:
      - ./promtail/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    deploy:
      replicas: 1
      placement:
        constriants:
          - node.role == manager
  grafana:
    image: grafana/grafana:latest
    environment:
      - GF_SERVER_ROOT_URL=${GRAFANA_URL:-%(protocol)s://%(domain)s:%(http_port)s/grafana/}
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    volumes:
      - grafana_data:/var/lib/grafana
      # Provisions Prometheus and Loki datasources automatically on startup.
      # No manual datasource setup needed after deployment.
      - ./grafana/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mygrafana.entrypoints=web"
      - "traefik.http.routers.mygrafana.rule=PathPrefix(`/grafana`)"
      - "traefik.http.services.mygrafana.loadbalancer.server.port=3000"
    deploy:
      replicas: 1
      placement:
        constriants:
          - node.role == manager
          
volumes:
  prometheus_data:
  grafana_data:
  loki_data:
