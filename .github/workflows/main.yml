name: CI/CD Pipeline

"on":
  push:
    # Only trigger on push to main branch
    branches:
      - main
  pull_request:
    # Only trigger on PRs targeting main branch
    branches:
      - main

permissions:
  pull-requests: write
  issues: write

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-go@0c52d547c9bc32b1aa3301fd7a9cb496313a4491 # v5.0.0
        with:
          go-version: stable
      - name: gofumpt
        run: |
          go install mvdan.cc/gofumpt@latest
          gofumpt -l -w .
      # TODO: Add auto-fix here
      # golang static tool for go
      - name: golangci-lint
        uses: golangci/golangci-lint-action@971e284b6050e8a5849b72094c50ab08da042db8 # v6.1.1
        with:
          version: v2.11.3
          args: --timeout=5m
      # hadolint statis tool for dockerfile
      - name: hadolint
        run: |
          wget -O /usr/local/bin/hadolint https://github.com/hadolint/hadolint/releases/latest/download/hadolint-Linux-x86_64
          chmod +x /usr/local/bin/hadolint
          hadolint --ignore DL3006 docker/Dockerfile-app
          hadolint --ignore DL3006 docker/Dockerfile-test
          hadolint --ignore DL3006 prometheus/Dockerfile-prometheus
      # htmlhint static tool for HTML
      - name: htmlhint
        run: |
          npm ci
          npx htmlhint "**/*.html" --config .htmlhintrc --format=compact
      # yamlint static tool for yaml/yml
      - name: yamllint
        run: |
          pip install yamllint --quiet
          yamllint -c .yamllint .

  test:
    needs: static-analysis  # tests only run if linting passes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run tests
        run: docker compose -f docker-compose-tests.yaml up --build --abort-on-container-exit --exit-code-from test

      - name: Tear down test stack
        if: always()
        run: docker compose -f docker-compose-tests.yaml down -v

  build-and-push:
    needs: [static-analysis, test]
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.prepare.outputs.image_tag }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Prepare environment variables and Docker tags
        id: prepare
        env:
          DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          # Sanitize branch name replacing slashes with dashes
          BRANCH_NAME=$(echo '${{ github.head_ref || github.ref_name }}' | tr '/' '-')
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            # Define tags for BOTH the main app and Prometheus
            echo "app_tags=${DOCKER_USER}/minitwit:latest" >> $GITHUB_OUTPUT
            echo "prom_tags=${DOCKER_USER}/minitwit-prometheus:latest" >> $GITHUB_OUTPUT
            echo "image_tag=latest" >> $GITHUB_OUTPUT
          else
            # Define tags for BOTH the main app and Prometheus for PRs
            echo "app_tags=${DOCKER_USER}/minitwit:test-${BRANCH_NAME},${DOCKER_USER}/minitwit:test-latest" >> $GITHUB_OUTPUT
            echo "prom_tags=${DOCKER_USER}/minitwit-prometheus:test-${BRANCH_NAME},${DOCKER_USER}/minitwit-prometheus:test-latest" >> $GITHUB_OUTPUT
            echo "image_tag=test-${BRANCH_NAME}" >> $GITHUB_OUTPUT
          fi

      - name: Login to Docker Hub
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push main app
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          file: docker/Dockerfile-app
          push: true
          # Use the app_tags output from the prepare step
          tags: ${{ steps.prepare.outputs.app_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Prometheus
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: ./prometheus
          file: ./prometheus/Dockerfile-prometheus
          push: true
          # Use the prom_tags output from the prepare step
          tags: ${{ steps.prepare.outputs.prom_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const body = `✅ Tests passed and test image built!

            Test image: \`test-feature-analysis_tools\`

            You can deploy this for manual testing if needed.`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Copy docker-compose file to server
        uses: appleboy/scp-action@82309101d24a66e66a3e6c0c16943806a09040c5 # v0.1.7
        with:
          host: ${{ github.ref == 'refs/heads/main' && secrets.DO_HOST || secrets.DO_HOST_STAGE }}
          username: ${{ secrets.DO_USER }}
          key: ${{ github.ref == 'refs/heads/main' && secrets.DO_SSH_KEY || secrets.DO_SSH_KEY_STAGE }}
          source: "docker-compose-app.yaml,loki,promtail,grafana"
          target: "/opt/minitwit"
          overwrite: true

      - name: Deploy via SSH
        uses: appleboy/ssh-action@7e5641ca49f298f02909477b949987a177259463 # v1.2.1
        env:
          DB_ADDR: ${{ github.ref == 'refs/heads/main' && secrets.DO_DB || secrets.DO_DB_STAGE }}
          DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/minitwit:${{ needs.build-and-push.outputs.image_tag }}
          PROM_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/minitwit-prometheus:${{ needs.build-and-push.outputs.image_tag }}
          PROM_URL: ${{ format('http://{0}.com:5001/prometheus', github.ref == 'refs/heads/main' && secrets.DO_HOST || secrets.DO_HOST_STAGE) }}
          GRAFANA_URL: ${{ format('http://{0}.com:5001/grafana/', github.ref == 'refs/heads/main' && secrets.DO_HOST || secrets.DO_HOST_STAGE) }}
        with:
          host: ${{ github.ref == 'refs/heads/main' && secrets.DO_HOST || secrets.DO_HOST_STAGE }}
          username: ${{ secrets.DO_USER }}
          key: ${{ github.ref == 'refs/heads/main' && secrets.DO_SSH_KEY || secrets.DO_SSH_KEY_STAGE }}
          envs: DB_ADDR,DOCKER_IMAGE,PROM_IMAGE,PROM_URL,GRAFANA_URL
          script: |
            cd /opt/minitwit
            echo "DOCKER_IMAGE=${DOCKER_IMAGE}" > .env
            # Write the PROM_IMAGE variable into the .env file on the server
            echo "PROM_IMAGE=${PROM_IMAGE}" >> .env
            echo "DB_ADDR=${DB_ADDR}" >> .env
            echo "PROM_URL=${PROM_URL}" >> .env
            echo "GRAFANA_URL=${GRAFANA_URL}" >> .env
            docker compose -f docker-compose-app.yaml pull
            docker compose -f docker-compose-app.yaml up -d
            docker image prune -f