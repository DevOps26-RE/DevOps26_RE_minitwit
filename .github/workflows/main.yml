name: CI/CD Pipeline

"on":
  push:
    # Only trigger on push to main branch
    branches:
      - main
  pull_request:
    # Only trigger on PRs targeting main branch
    branches:
      - main

permissions:
  pull-requests: write
  issues: write

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: gofumpt
        run: |
          go install mvdan.cc/gofumpt@latest
          gofumpt -l -w .
      # TODO: Add auto-fix here
      # golang static tool for go
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11.3
          args: --timeout=5m
      # hadolint statis tool for dockerfile
      - name: hadolint
        run: |
          wget -O /usr/local/bin/hadolint https://github.com/hadolint/hadolint/releases/latest/download/hadolint-Linux-x86_64
          chmod +x /usr/local/bin/hadolint
          hadolint --ignore DL3006 docker/Dockerfile-app
          hadolint --ignore DL3006 docker/Dockerfile-test
          hadolint --ignore DL3006 prometheus/Dockerfile-prometheus
      # htmlhint static tool for HTML
      - name: htmlhint
        run: |
          npm ci
          npx htmlhint "**/*.html" --config .htmlhintrc --format=compact
      # yamlint static tool for yaml/yml
      - name: yamllint
        run: |
          pip install yamllint --quiet
          yamllint -c .yamllint .

  test:
    needs: static-analysis  # tests only run if linting passes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: docker compose -f docker-compose-tests.yaml up --build --abort-on-container-exit --exit-code-from test

      - name: Tear down test stack
        if: always()
        run: docker compose -f docker-compose-tests.yaml down -v

  build-and-push:
    needs: [static-analysis, test]
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.prepare.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare environment variables and Docker tags
        id: prepare
        env:
          DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          # Sanitize branch name replacing slashes with dashes
          BRANCH_NAME=$(echo '${{ github.head_ref || github.ref_name }}' | tr '/' '-')
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            # Define tags for BOTH the main app and Prometheus
            echo "app_tags=${DOCKER_USER}/minitwit:latest" >> $GITHUB_OUTPUT
            echo "prom_tags=${DOCKER_USER}/minitwit-prometheus:latest" >> $GITHUB_OUTPUT
            echo "image_tag=latest" >> $GITHUB_OUTPUT
          else
            # Define tags for BOTH the main app and Prometheus for PRs
            echo "app_tags=${DOCKER_USER}/minitwit:test-${BRANCH_NAME},${DOCKER_USER}/minitwit:test-latest" >> $GITHUB_OUTPUT
            echo "prom_tags=${DOCKER_USER}/minitwit-prometheus:test-${BRANCH_NAME},${DOCKER_USER}/minitwit-prometheus:test-latest" >> $GITHUB_OUTPUT
            echo "image_tag=test-${BRANCH_NAME}" >> $GITHUB_OUTPUT
          fi

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push main app
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile-app
          push: true
          # Use the app_tags output from the prepare step
          tags: ${{ steps.prepare.outputs.app_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Prometheus
        uses: docker/build-push-action@v5
        with:
          context: ./prometheus
          file: ./prometheus/Dockerfile-prometheus
          push: true
          # Use the prom_tags output from the prepare step
          tags: ${{ steps.prepare.outputs.prom_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const body = `✅ Tests passed and test image built!

            Test image: \`test-feature-analysis_tools\`

            You can deploy this for manual testing if needed.`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
  # ---------------------------------------------------------------------------
  # Deploy — Docker Swarm rolling update
  # ---------------------------------------------------------------------------
  # WHAT CHANGED from the old deploy job:
  #   OLD: scp files to server → ssh → docker compose pull → docker compose up
  #   NEW: ssh → docker service update --image <new-tag>
  #
  # WHY the change:
  #   1. docker compose up restarts ALL containers every deploy, causing brief
  #      downtime. `docker service update` does a rolling update: starts the
  #      new container (start-first policy), waits for it to be healthy, then
  #      stops the old one. Zero downtime.
  #   2. Config files (loki/, promtail/, grafana/, docker-stack.yml) no longer
  #      need copying on every deploy — Ansible manages them. CI only ships
  #      new Docker image tags.
  #   3. The deploy target is now DO_SWARM_HOST (Node 3 / swarmnode), not
  #      DO_HOST (Node 1). Any Swarm manager can run `docker service update`.
  #
  # REQUIRED GITHUB SECRETS (update in repo Settings → Secrets):
  #   DO_SWARM_HOST    Public IP of swarmnode (Node 3) — new
  #   DO_USER          SSH username (root) — unchanged
  #   DO_SSH_KEY       SSH private key for swarmnode — update if different
  #   DO_SWARM_HOST_STAGE  Stage swarmnode IP — for non-main branches
  #   DO_SSH_KEY_STAGE     Stage SSH key — unchanged
  #
  # SERVICE NAMES follow the pattern: <stack_name>_<service_name>
  #   Stack name is set in ansible/inventory/group_vars/all.yml: minitwit_stack
  #   So: minitwit_stack_web, minitwit_stack_prometheus
  #   Verify with: docker service ls  (on any swarm manager)
  # ---------------------------------------------------------------------------
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy app image to Swarm (rolling update)
        # Triggers a rolling update of the web service with the new image.
        # --update-order start-first: start new → wait healthy → stop old
        # --update-failure-action rollback: auto-revert if new container fails
        # --with-registry-auth: passes Docker Hub credentials from the manager
        #   node's stored login so Swarm workers can pull the new image.
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ github.ref == 'refs/heads/main' && secrets.DO_SWARM_HOST || secrets.DO_SWARM_HOST_STAGE }}
          username: ${{ secrets.DO_USER }}
          key: ${{ github.ref == 'refs/heads/main' && secrets.DO_SSH_KEY || secrets.DO_SSH_KEY_STAGE }}
          script: |
            docker service update \
              --image ${{ secrets.DOCKERHUB_USERNAME }}/minitwit:${{ needs.build-and-push.outputs.image_tag }} \
              --update-order start-first \
              --update-failure-action rollback \
              --with-registry-auth \
              minitwit_stack_web

      - name: Deploy prometheus image to Swarm (rolling update)
        # Separate step so a web update failure (and rollback) does not
        # also skip the prometheus update, and vice versa. The two services
        # are independently versioned and independently deployable.
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ github.ref == 'refs/heads/main' && secrets.DO_SWARM_HOST || secrets.DO_SWARM_HOST_STAGE }}
          username: ${{ secrets.DO_USER }}
          key: ${{ github.ref == 'refs/heads/main' && secrets.DO_SSH_KEY || secrets.DO_SSH_KEY_STAGE }}
          script: |
            docker service update \
              --image ${{ secrets.DOCKERHUB_USERNAME }}/minitwit-prometheus:${{ needs.build-and-push.outputs.image_tag }} \
              --update-order start-first \
              --update-failure-action rollback \
              --with-registry-auth \
              minitwit_stack_prometheus
