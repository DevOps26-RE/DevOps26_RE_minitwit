name: Deploy DB Changes to Droplet

on:
  push:
    branches:
      - main
    paths:
      - 'db/schema.sql'
      - 'docker-compose-db.yaml'
      - '.github/workflows/deploy-db.yml'

jobs:
  deploy-db:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy files to DB Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DB_HOST }}
          username: ${{ secrets.DB_USER }}
          key: ${{ secrets.DB_SSH_KEY }}
          # This copies your compose file and the entire db folder (with schema.sql)
          source: "docker-compose-db.yaml,db"
          target: "/root"
          overwrite: true

      - name: Update Database and Schema via SSH
        uses: appleboy/ssh-action@v1.2.1
        with:
          host: ${{ secrets.DB_HOST }}
          username: ${{ secrets.DB_USER }}
          key: ${{ secrets.DB_SSH_KEY }}
          script: |
            cd /root
            
            echo "Updating Docker container configuration..."
            # This will only restart the DB if the docker-compose-db.yaml changed
            docker compose -f docker-compose-db.yaml up -d
            
            echo "Applying schema changes inside the container..."
            # We pipe the local schema.sql file into the running docker container
            cat db/schema.sql | docker exec -i root-db-1 psql -U minitwit -d minitwit
            
            echo "DB Deployment Successful"