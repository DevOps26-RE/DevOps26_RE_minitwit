name: Deploy DB Infrastructure to Droplet

on:
  push:
    branches:
      - main
    paths:
      - 'docker-compose-db.yaml'
      - '.github/workflows/deploy-db.yml'
  pull_request:
    paths:
      - 'docker-compose-db.yaml'
      - '.github/workflows/deploy-db.yml'

jobs:
  deploy-db:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Copy Compose file to DB Server
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ github.ref == 'refs/heads/main' && vars.DB_PUBLIC_IP || vars.DB_PUBLIC_IP_STAGE }}
          username: ${{ vars.DO_USER }}
          key: ${{ github.ref == 'refs/heads/main' && secrets.DO_SSH_KEY || secrets.DO_SSH_KEY_STAGE }}
          source: "docker-compose-db.yaml"
          target: "/root"
          overwrite: true

      - name: Update Database Container via SSH
        uses: appleboy/ssh-action@8faa84277b88b6cd1455986f459aa66cf72bc8a3 #v1.2.1
        with:
          host: ${{ github.ref == 'refs/heads/main' && vars.DB_PUBLIC_IP || vars.DB_PUBLIC_IP_STAGE }}
          username: ${{ vars.DO_USER }}
          key: ${{ github.ref == 'refs/heads/main' && secrets.DO_SSH_KEY || secrets.DO_SSH_KEY_STAGE }}
          script: |
            cd /root
            echo "Updating Docker container configuration on ${{ github.ref == 'refs/heads/main' && 'Production' || 'Staging' }}..."
            docker compose -f docker-compose-db.yaml up -d
            echo "DB Infrastructure Deployment Successful"