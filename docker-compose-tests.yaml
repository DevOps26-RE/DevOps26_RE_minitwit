services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: minitwit
      POSTGRES_PASSWORD: minitwit
      POSTGRES_DB: minitwit
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minitwit"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile-app
    environment:
      DB_ADDR: db
    ports:
      - "5001:5001"
    depends_on:
      db:
        condition: service_healthy

  test:
    build:
      context: .
      dockerfile: docker/Dockerfile-test
    environment:
      BASE_URL: http://web:5001
      API_BASE_URL: http://web:5001/api
      GUI_URL: http://web:5001/register
      SELENIUM_REMOTE_URL: http://selenium:4444/wd/hub
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: minitwit
      PGUSER: minitwit
      PGPASSWORD: minitwit
    depends_on:
      - web
      - selenium
    entrypoint: ["sh", "test/run_all_tests.sh"]

  selenium:
    image: selenium/standalone-chromium:latest
    shm_size: 2gb
    environment:
      SE_NODE_MAX_SESSIONS: 1
      SE_NODE_OVERRIDE_MAX_SESSIONS: true